backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "site_content"
    label: "Website Content"
    files:
      - name: "main"
        label: "Homepage Content"
        file: "content.json"
        fields:
          - { label: "Hero — Eyebrow Tag", name: "hero_eyebrow", widget: "string" }
          - { label: "Hero — Headline (HTML allowed, e.g. <em>text</em>)", name: "hero_headline", widget: "string" }
          - { label: "Hero — Subheadline", name: "hero_lead", widget: "text" }
          - { label: "About — Paragraph 1", name: "about_p1", widget: "text" }
          - { label: "About — Paragraph 2", name: "about_p2", widget: "text" }
          - { label: "About — Paragraph 3", name: "about_p3", widget: "text" }
          - { label: "CEO — Name", name: "ceo_name", widget: "string" }
          - { label: "CEO — Title", name: "ceo_title", widget: "string" }
          - { label: "CEO — Short Bio", name: "ceo_bio", widget: "text" }
          - { label: "Maize Starter Pack — Description", name: "pack_desc", widget: "text" }
          - { label: "Farmer Support — Intro Paragraph", name: "support_desc", widget: "text" }
          - { label: "Contact — Address", name: "contact_address", widget: "string" }
          - { label: "Contact — Phone Numbers", name: "contact_phone", widget: "string" }
          - { label: "Contact — Email", name: "contact_email", widget: "string" }
